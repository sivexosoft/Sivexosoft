<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 | SivexoSoft</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="assets/images/favicon.png" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/style.css" />
<style>
.notfound{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px}
.notfound__inner{max-width:640px}
.notfound__code{font-size:clamp(80px,18vw,180px);font-weight:900;letter-spacing:-.05em;background:linear-gradient(135deg,#fff 0%,#B65FF7 60%,#8F3FF0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.notfound h1{font-size:clamp(28px,4vw,44px);margin:16px 0 12px;color:#fff;letter-spacing:-.03em}
.notfound p{color:#92929D;margin-bottom:32px}
</style>
</head>
<body>
<main class="notfound">
  <div class="notfound__inner">
    <div class="notfound__code">404</div>
    <h1>This page drifted out of orbit.</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="index.html" class="btn btn--primary">BACK TO HOME <i class="fa-solid fa-arrow-right"></i></a>
  </div>
</main>
</body>
</html>
